# Nombre de la aplicación Spring Boot
spring.application.name=backend

# ── Servidor ────────────────────────────────────────────────────────────────
# Puerto donde corre el Backend. El BFF lo llama en http://localhost:8080
server.port=8080

# ── Base de datos ────────────────────────────────────────────────────────────
# URL de conexión a MySQL local. "foro_backend" es el nombre de la base de datos
# que hay que crear manualmente antes de levantar el proyecto:
# CREATE DATABASE foro_backend;
spring.datasource.url=jdbc:mysql://localhost:3306/foro_backend

# Credenciales de MySQL. Cambiar si el usuario/password local es distinto
spring.datasource.username=root
spring.datasource.password=root

# Driver JDBC de MySQL que usa Spring para conectarse
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
# "update" hace que Hibernate cree o actualice las tablas automáticamente
# al levantar el proyecto, basándose en las entidades JPA (@Entity)
# Opciones: create (borra y recrea), update (solo agrega cambios), validate (solo valida)
spring.jpa.hibernate.ddl-auto=update

# Muestra en consola el SQL que ejecuta Hibernate. Útil para debuggear
spring.jpa.show-sql=true

# Dialecto SQL específico para MySQL. Le dice a Hibernate qué sintaxis usar
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect